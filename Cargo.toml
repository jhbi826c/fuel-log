[package]
name = "fuel-log"
version = "0.1.0"
edition = "2024"
description = "Personal fuel consumption tracker (Leptos CSR, static PWA)"
license = "MIT"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
console_error_panic_hook = "0.1"
sha1_smol = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "Geolocation",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "PositionOptions",
  "RequestCache",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Storage",
  "Url",
  "WheelEvent",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
